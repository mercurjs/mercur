<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mercur</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #090909;
        color: #ffffff;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #c6c6c6;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.25rem;
        background: #ffffff;
        color: #090909;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Mercur</h1>
        <p id="status">Connecting to your marketplace…</p>
        <button type="button" id="retry">Try again</button>
      </div>
    </main>
    <script>
      const fallback = "http://127.0.0.1:3000";
      const target = window.MERCURE_STOREFRONT_URL || fallback;
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");

      function openStorefront() {
        status.textContent = "Connecting to your marketplace…";
        window.location.replace(target);
      }

      retry.addEventListener("click", openStorefront);
      window.addEventListener("online", openStorefront);
    </script>
  </body>
</html>
